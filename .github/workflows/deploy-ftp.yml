name: Build MicroluxErgConnect.Desktop - ZIP - FTP (self-contained)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    env:
      RID: win-x86
      OUT_DIR: publish
      ZIP_NAME: ErgComTester.Update.zip
      XML_NAME: ErgComTester.Update.xml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
            6.0.x

      - name: Locate project MicroluxErgConnect.Desktop.csproj
        shell: pwsh
        run: |
          $match = Get-ChildItem -Recurse -Filter "MicroluxErgConnect.Desktop.csproj" | Select-Object -First 1
          if (-not $match) {
            Write-Error "MicroluxErgConnect.Desktop.csproj not found anywhere in repo"
            Get-ChildItem -Recurse -Filter *.csproj | ForEach-Object { Write-Host "Found csproj: $($_.FullName)" }
            exit 1
          }
          $path = $match.FullName -replace '\\','/'
          "PROJECT_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using project path: $path"

      - name: Read version from csproj
        shell: pwsh
        run: |
          $proj = "${{ env.PROJECT_PATH }}"
          [xml]$doc = Get-Content -Path $proj
          $asm   = $doc.SelectSingleNode("//AssemblyVersion")
          $file  = $doc.SelectSingleNode("//FileVersion")
          $verEl = $doc.SelectSingleNode("//Version")
          $asmV  = if ($asm ) { $asm.InnerText }  else { "" }
          $fileV = if ($file) { $file.InnerText } else { "" }
          $versV = if ($verEl) { $verEl.InnerText } else { "" }
          $ver   = @($asmV,$fileV,$versV) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($ver)) { throw "No AssemblyVersion/FileVersion/Version found in $proj" }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Detected version: $ver"

      - name: Restore (${{ env.RID }})
        shell: pwsh
        run: dotnet restore "${{ env.PROJECT_PATH }}" -r ${{ env.RID }}

      - name: Build (Release, ${{ env.RID }})
        shell: pwsh
        run: dotnet build "${{ env.PROJECT_PATH }}" -c Release -r ${{ env.RID }} --no-restore

      - name: Publish self-contained single-file (Release, ${{ env.RID }})
        shell: pwsh
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" -c Release -r ${{ env.RID }} `
            -p:SelfContained=true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:CopyOutputSymbolsToPublishDirectory=false `
            -p:CopyDocumentationFileToPublishDirectory=false `
            -p:DebugType=None `
            -o "${{ env.OUT_DIR }}"

      - name: Make ZIP from publish output
        shell: pwsh
        run: |
          if (Test-Path "${{ env.ZIP_NAME }}") { Remove-Item "${{ env.ZIP_NAME }}" -Force }
          if (!(Test-Path "${{ env.OUT_DIR }}")) { throw "Publish output not found: $env:OUT_DIR" }
          Compress-Archive -Path (Join-Path $env:OUT_DIR '*') -DestinationPath "${{ env.ZIP_NAME }}" -Force
          Write-Host "ZIP created: $env:ZIP_NAME"

      - name: Create ErgComTester.Update.xml
        shell: pwsh
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
        run: |
          $version = "${{ env.VERSION }}"
          $targetDir = if ("$env:FTP_DIR") { "$env:FTP_DIR" } else { "/other/ErgComTester/" }
          $targetDir = $targetDir.TrimEnd('/')
          $url = "ftp://$env:FTP_HOST$targetDir/${{ env.ZIP_NAME }}"

          $doc  = New-Object System.Xml.XmlDocument
          $decl = $doc.CreateXmlDeclaration("1.0","UTF-8",$null); [void]$doc.AppendChild($decl)
          $item = $doc.CreateElement("item"); [void]$doc.AppendChild($item)
          foreach($n in @("version","url","changelog")) {
            $el = $doc.CreateElement($n); [void]$item.AppendChild($el)
          }
          $item.version.InnerText = $version
          $item.url.InnerText = $url
          $item.changelog.InnerText = ""

          $mand = $doc.CreateElement("mandatory")
          $attr = $doc.CreateAttribute("mode"); $attr.Value = "1"; [void]$mand.Attributes.Append($attr)
          $mand.InnerText = "true"; [void]$item.AppendChild($mand)

          $doc.Save("${{ env.XML_NAME }}")
          Write-Host "Created $($env:XML_NAME) with version $version and url $url"

      - name: Upload ZIP and XML to FTP
        shell: pwsh
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
        run: |
          $targetDir = if ("${{ env.FTP_DIR }}") { "${{ env.FTP_DIR }}" } else { "/other/ErgComTester/" }
          $targetDir = $targetDir.TrimEnd('/')

          Write-Host "Uploading to ftp://$env:FTP_HOST$targetDir"

          & curl.exe --fail --show-error --ftp-create-dirs `
            -T "${{ env.ZIP_NAME }}" `
            --user "$env:FTP_USER`:$env:FTP_PASS" `
            "ftp://$env:FTP_HOST$targetDir/${{ env.ZIP_NAME }}"

          & curl.exe --fail --show-error --ftp-create-dirs `
            -T "${{ env.XML_NAME }}" `
            --user "$env:FTP_USER`:$env:FTP_PASS" `
            "ftp://$env:FTP_HOST$targetDir/${{ env.XML_NAME }}"
