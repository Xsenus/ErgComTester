name: Build MicroluxErgConnect.Desktop - ZIP - FTP

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: publish
      ZIP_NAME: ErgComTester.Update.zip
      XML_NAME: ErgComTester.Update.xml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
            6.0.x

      - name: Locate project MicroluxErgConnect.Desktop.csproj
        shell: bash
        run: |
          set -euo pipefail
          MATCH=$(find . -type f -name "MicroluxErgConnect.Desktop.csproj" | head -n1)
          if [ -z "$MATCH" ]; then
            echo "MicroluxErgConnect.Desktop.csproj not found anywhere in repo"
            echo "Repository tree (top level):"; ls -la
            exit 1
          fi
          echo "Found project at: $MATCH"
          echo "PROJECT_PATH=$MATCH" >> "$GITHUB_ENV"

      - name: Verify found project path
        run: echo "Using project path: $PROJECT_PATH"

      - name: Read Version from csproj
        id: ver
        shell: pwsh
        run: |
          $proj = "${{ env.PROJECT_PATH }}"
          if (!(Test-Path $proj)) { throw "Project file not found: $proj" }
          [xml]$doc = Get-Content $proj

          $asmNode  = $doc.SelectSingleNode("//AssemblyVersion")
          $fileNode = $doc.SelectSingleNode("//FileVersion")
          $asmVer  = if ($asmNode  -ne $null) { $asmNode.InnerText }  else { "" }
          $fileVer = if ($fileNode -ne $null) { $fileNode.InnerText } else { "" }
          $version = if ([string]::IsNullOrWhiteSpace($asmVer)) { $fileVer } else { $asmVer }
          if ([string]::IsNullOrWhiteSpace($version)) { throw "No AssemblyVersion/FileVersion found in $proj" }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Detected version: $version"

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build (Release)
        run: dotnet build "${{ env.PROJECT_PATH }}" -c Release --no-restore

      - name: Publish (Release)
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c Release -o "${{ env.OUT_DIR }}" --no-build

      - name: Create ErgComTester.Update.xml
        shell: pwsh
        run: |
          $version = "${{ env.VERSION }}"
          $url = "ftp://90.189.149.59/other/ErgComTester/ErgComTester.Update.zip"

          $doc   = New-Object System.Xml.XmlDocument
          $decl  = $doc.CreateXmlDeclaration("1.0","UTF-8",$null)
          [void]$doc.AppendChild($decl)

          $item = $doc.CreateElement("item")
          [void]$doc.AppendChild($item)

          $ver = $doc.CreateElement("version")
          $ver.InnerText = $version
          [void]$item.AppendChild($ver)

          $u = $doc.CreateElement("url")
          $u.InnerText = $url
          [void]$item.AppendChild($u)

          $cl = $doc.CreateElement("changelog")
          $cl.InnerText = ""
          [void]$item.AppendChild($cl)

          $mand = $doc.CreateElement("mandatory")
          $attr = $doc.CreateAttribute("mode")
          $attr.Value = "1"
          [void]$mand.Attributes.Append($attr)
          $mand.InnerText = "true"
          [void]$item.AppendChild($mand)

          $doc.Save("${{ env.XML_NAME }}")
          Write-Host "Created $($env:XML_NAME) with version $version"

      - name: Make ZIP from publish output
        run: |
          rm -f "${{ env.ZIP_NAME }}"
          cd "${{ env.OUT_DIR }}"
          zip -r "../${{ env.ZIP_NAME }}" ./*
          cd -

      - name: Upload ZIP and XML to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
        run: |
          set -euo pipefail
          TARGET_DIR=${FTP_DIR:-/other/ErgComTester/}
          echo "Uploading to ftp://${FTP_HOST}${TARGET_DIR}"

          curl --fail --show-error --ftp-create-dirs \
               -T "${{ env.ZIP_NAME }}" \
               --user "$FTP_USER:$FTP_PASS" \
               "ftp://${FTP_HOST}${TARGET_DIR%/}/${{ env.ZIP_NAME }}"

          curl --fail --show-error --ftp-create-dirs \
               -T "${{ env.XML_NAME }}" \
               --user "$FTP_USER:$FTP_PASS" \
               "ftp://${FTP_HOST}${TARGET_DIR%/}/${{ env.XML_NAME }}"
